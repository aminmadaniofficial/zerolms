name: ZeroLMS Automated CI/CD Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  php-lint-and-tests:
    name: PHP Syntax Lint & Sanity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, gd, mbstring, json

      - name: Verify PHP Syntax Across All Files
        run: |
          echo "Linting all PHP files for syntax errors..."
          find . -type f -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

      - name: Run Automated Sanity & Smoke Test Suite
        run: |
          php tests/smoke_test.php

  frontend-build-check:
    name: Frontend Assets & Tailwind Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Build Dependencies
        run: |
          npm ci || npm install

      - name: Validate Tailwind CSS Compilation
        run: |
          ./node_modules/.bin/tailwindcss -i css/input.css -o /tmp/landing.test.css --minify
          test -s /tmp/landing.test.css && echo "Tailwind build verified successfully!"

  docker-compose-check:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
