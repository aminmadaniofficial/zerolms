name: Deploy ZeroLMS to Bahonar Karaj Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 3939 
        script: |
          cd /var/www/bahonarkaraj.ir/html
          
          # تنظیم پوشه به عنوان دایرکتوری امن برای گیت سرور
          git config --global --add safe.directory /var/www/bahonarkaraj.ir/html
          
          # اگر گیت از قبل ست نشده، آن را مقداردهی کن و ریموت را بساز
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/aminmadaniofficial/zerolms.git
          fi
          
          # دریافت آخرین تغییرات و اوررایت کردن روی فایل‌های سرور
          git fetch --all
          git reset --hard origin/main
          
          # اجرای کامپوز به صورت کاملاً استاندارد و مستقل از نسخه داکر سرور
          docker compose down || true
          docker compose up -d --build