name: Deploy ZeroLMS to Bahonar Karaj Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 3939 
        script: |
          cd /var/www/bahonarkaraj.ir/html
          
          if [ ! -d ".git" ]; then
            # اگر سرور پورتش غیر از ۲۲ است، باید برای کلون کردن گیت‌هاب هم تنظیم شود
            git clone https://github.com/aminmadaniofficial/zerolms.git .
          else
            git fetch --all
            git reset --hard origin/main
          fi
          
          docker compose up -d --build