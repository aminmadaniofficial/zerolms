services:
  web:
    build: .
    platform: linux/amd64
    container_name: php_app_container
    restart: always                  
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    platform: linux/amd64
    container_name: mysql_db_container
    command: --lower_case_table_names=1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "134679852Mm"
      MYSQL_DATABASE: "school_online"
      MYSQL_USER: "zerolms"
      MYSQL_PASSWORD: "1597538264Mm"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
