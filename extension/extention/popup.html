<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هوشیار</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: linear-gradient(135deg, #6b48ff, #00ddeb);
      --secondary-color: linear-gradient(135deg, #ff2e63, #ff9f43);
      --bg-color: #0d0d1f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --text-color: #e0e7ff;
      --accent-color: #00ff88;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Vazir', 'Shabnam', Tahoma, sans-serif;
      background: linear-gradient(120deg, #0d0d1f, #1a1a3a, #0d0d1f);
      background-size: 600% 600%;
      animation: moveBg 15s ease infinite;
      color: var(--text-color);
      min-width: 380px;
      min-height: 520px;
    }

    @keyframes moveBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      text-align: center;
      padding: 20px 15px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header h2 {
      margin: 0;
      font-size: 22px;
      text-shadow: 0 0 10px var(--accent-color);
      animation: glowText 2s ease-in-out infinite alternate;
    }

    @keyframes glowText {
      from { text-shadow: 0 0 10px #00ff88, 0 0 20px rgba(0,255,136,0.4); }
      to { text-shadow: 0 0 15px #ff2e63, 0 0 25px rgba(255,46,99,0.6); }
    }

    .status {
      text-align: center;
      padding: 8px;
      font-size: 14px;
    }

    .status i {
      font-size: 18px;
      margin-left: 8px;
    }

    .online { color: #00ff88; }
    .offline { color: #ff2e63; }

    .notifications {
      padding: 15px;
      max-height: 380px;
      overflow-y: auto;
      width: 95%;
    }

    .notif-item {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      margin-right: 20px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }

    .notif-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,255,136,0.2);
    }

    .notif-title {
      font-weight: bold;
      color: #00ddeb;
      margin-bottom: 5px;
    }

    .notif-time {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.6;
      font-size: 15px;
    }

    .settings-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
    }

    .settings-btn:hover {
      background: var(--accent-color);
      color: black;
    }

    .footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      opacity: 0.7;
      border-top: 1px solid rgba(255,255,255,0.1);
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.3);
    }

    .login-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .login-box {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: black;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <button class="settings-btn" id="settingsBtn">
    <i class="bi bi-gear-fill"></i>
  </button>

  <div class="header">
    <h2>هوشیار باش !</h2>
    <div class="status" id="status">
      <span id="statusText">در حال بررسی...</span>
      <i id="statusIcon" class="bi bi-wifi-off"></i>
    </div>
  </div>

  <div class="notifications" id="notificationsList">
    <div class="empty">در حال بارگذاری...</div>
  </div>

  <div class="footer">
    برنامه‌نویسی شده توسط <strong>محمدامین مدنی محمدی</strong> ©
  </div>

  <div class="login-modal" id="loginModal">
    <div class="login-box">
      <h3>ورود توکن</h3>
      <p style="font-size:13px;opacity:0.8;margin:15px 0;">توکن خود را از تنظیمات LMS کپی کنید</p>
      <input type="text" id="tokenInput" placeholder="مثال: a1b2c3d4e5f6g7h8...">
      <button id="connectBtn">اتصال</button>
      <div id="loginMessage" style="margin-top:10px;font-size:13px;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
