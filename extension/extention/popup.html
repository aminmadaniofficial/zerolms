<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هوشیار | دستیار اعلان مدرسه</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-accent: #6366f1;
    }

    * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: #f8fafc;
      width: 360px; height: 500px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }

    .header h2 { margin: 0; font-size: 1.1rem; color: #f8fafc; display: flex; align-items: center; gap: 8px; }

    .status-badge {
      font-size: 0.78rem; padding: 4px 10px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
    }

    .status-badge.online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-badge.offline { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }

    .btn-icon {
      background: transparent; border: none; color: #94a3b8; font-size: 1.1rem; cursor: pointer; transition: color 0.2s;
    }
    .btn-icon:hover { color: #818cf8; }

    .notifications {
      flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }

    .notif-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      transition: transform 0.2s;
    }
    .notif-item:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.4); }

    .notif-title { font-weight: 700; font-size: 0.9rem; color: #38bdf8; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .notif-msg { font-size: 0.82rem; color: #cbd5e1; line-height: 1.5; }

    .empty { text-align: center; margin: auto; color: #94a3b8; font-size: 0.88rem; }

    .footer {
      padding: 10px; text-align: center; font-size: 0.75rem; color: #94a3b8;
      border-top: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.95);
    }

    .modal-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.95);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      background: #0f172a; border: 1px solid var(--border-color);
      border-radius: 16px; padding: 20px; width: 100%; text-align: center;
    }

    .form-control {
      width: 100%; background: #1e293b; border: 1px solid var(--border-color);
      color: #f8fafc; padding: 10px; border-radius: 10px; font-size: 0.85rem; margin: 12px 0; text-align: center;
    }

    .btn-connect {
      width: 100%; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none;
      color: white; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2><i class="bi bi-bell-fill" style="color:#818cf8;"></i> هوشیار</h2>
    <div class="d-flex align-items-center gap-2">
      <div id="statusBadge" class="status-badge offline">
        <i class="bi bi-circle-fill" style="font-size:0.5rem;"></i>
        <span id="statusText">قطع</span>
      </div>
      <button class="btn-icon ms-2" id="settingsBtn" title="تنظیمات توکن"><i class="bi bi-gear"></i></button>
    </div>
  </div>

  <div class="notifications" id="notificationsList">
    <div class="empty">در حال بررسی اطلاعات...</div>
  </div>

  <div class="footer">
    طراحی شده توسط <strong>محمدامین مدنی محمدی</strong>
  </div>

  <!-- مودال اتصال توکن -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <h6 style="color:#a855f7;"><i class="bi bi-key me-1"></i> اتصال توکن سیستم</h6>
      <p style="font-size:0.8rem; color:#94a3b8; margin-top:8px;">کد ۳۲ کاراکتری اکستنشن را از تنظیمات LMS وارد کنید.</p>
      <input type="text" id="tokenInput" class="form-control" placeholder="چسباندن توکن..." autocomplete="off">
      <button class="btn-connect" id="connectBtn">اتصال به سامانه</button>
      <div id="loginMessage" style="margin-top:10px; font-size:0.8rem;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
